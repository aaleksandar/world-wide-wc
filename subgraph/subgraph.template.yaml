specVersion: 1.2.0
description: World Wide WC — a map of public toilets contributed by humans and agents.
repository: https://github.com/worldwidewc/world-wide-wc
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: WorldWideWC
    network: {{network}}
    source:
      address: "{{address}}"
      abi: WorldWideWC
      startBlock: {{startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Toilet
        - Rating
        - Contributor
        - Donation
        - Global
      abis:
        - name: WorldWideWC
          file: ./abis/WorldWideWC.json
      eventHandlers:
        - event: ToiletLogged(indexed uint256,indexed address,int32,int32,bool,string)
          handler: handleToiletLogged
        - event: ToiletRated(indexed uint256,indexed address,string)
          handler: handleToiletRated
        - event: Donated(indexed address,uint256,string)
          handler: handleDonated
        - event: Claimed(indexed address,uint256)
          handler: handleClaimed
